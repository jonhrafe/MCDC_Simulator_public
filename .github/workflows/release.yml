name: release

# Builds the MC/DC binaries on every platform and publishes them as assets on the
# GitHub Release for the pushed version tag (e.g. v2.2.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/update the Release and upload assets

jobs:
  # 1) Build a portable Release binary on each target and upload it as a CI artifact.
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64 }
          - { os: macos-13,       target: macos-x64 }    # Intel
          - { os: macos-latest,   target: macos-arm64 }  # Apple Silicon
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (portable, no -march=native)
        run: cmake -B build -DMCDC_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage + package
        shell: bash
        run: |
          set -e
          ver="${GITHUB_REF_NAME}"                 # the tag, e.g. v2.2.0
          stage="mcdc-${ver}-${{ matrix.target }}"
          mkdir -p "$stage"
          # RUNTIME_OUTPUT_DIRECTORY is the source root; MSVC multi-config nests under Release/.
          for exe in MC-DC_Simulator dataSynth; do
            found=""
            for cand in "$exe" "$exe.exe" "Release/$exe.exe" "Release/$exe" "build/$exe" "build/Release/$exe.exe"; do
              if [ -f "$cand" ]; then cp "$cand" "$stage/"; found=1; break; fi
            done
            if [ -z "$found" ]; then echo "::error::$exe not found"; ls -la; ls -la Release build 2>/dev/null || true; exit 1; fi
          done
          cp LICENSE README.md "$stage/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${stage}.zip" "$stage" >/dev/null      # 7z ships on the Windows runners
          else
            tar -czf "${stage}.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            mcdc-*.tar.gz
            mcdc-*.zip
          if-no-files-found: error

  # 2) Collect all artifacts and publish them on the tag's Release in a single step
  #    (one release-creation -> no race between the parallel build jobs).
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
