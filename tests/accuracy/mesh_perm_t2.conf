# GPU Phase-6 validation: MESH permeability + finite T2. Permeable unitMesh sphere,
# kappa=1e-4 m/s, intra T2=40ms (list col-4) vs extra T2=80ms, distinct Di=0.5e-9 /
# De=2.0e-9. Walkers cross intra<->extra (transparent membrane, re-classified at
# landing) and accumulate per-step dt/T2 of the CURRENT compartment. As with the
# analytic perm+T2 case, the fragile equilibrium couples into the total under the
# differential T2, so both split and total tolerances are relaxed.
N 20000
T 1000
duration 0.050
diffusivity 0.6e-9
d_extra 2.0e-9
exp_prefix tests/accuracy/output/mesh_perm_t2
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
t2_extra 0.080
<obstacle>
ply_extended_file_list tests/accuracy/mesh_perm_t2.list
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
