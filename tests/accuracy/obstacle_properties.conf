# =============================================================================
#  MC-DC Simulator -- configuration file. Standard units (m, s, T).
#
#  Per-obstacle property tracking check: TWO permeable meshes with DISTINCT
#  d_intra, T2 and permeability each, plus distinct extra-cellular d_extra/t2_extra.
#  Walkers seeded uniformly and the membranes are permeable, so they move between
#  ply0, ply1 and extra. With `debug` on, the per-step trace lets the test verify
#  each walker always carries the Di/T2 of the compartment it is in (no stale
#  indices / cross-contamination), and the perm counters verify per-obstacle kappa.
#  num_process 1 so the (process-shared) counters are exact.
# =============================================================================

N 400
T 200
duration 0.050

diffusivity 0.6e-9
d_extra 1.5e-9
t2_extra 0.070

exp_prefix tests/accuracy/output/obstacle_properties
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

<obstacle>
ply_extended_file_list tests/accuracy/obstacle_properties.list
</obstacle>

<voxels>
-1.2e-6 -1.2e-6 -1.2e-6
 2.8e-6  1.2e-6  1.2e-6
</voxels>

num_process 1
seed 12345
debug
<END>
