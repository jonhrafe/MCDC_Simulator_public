# GPU-vs-CPU validation: GAMMA-distributed spheres (SI units: beta/min_radius in metres).
# Restricted diffusion among a gamma packing; the host generates the substrate (seeded),
# both engines walk it. Guards the gamma generator + the GPU sphere path + SI units.
N 2000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/gamma_sphere
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
separate_signals
write_traj_file 0
t2_extra 1e9
<obstacle>
<sphere_gamma_packing>
alpha 1.5
beta 0.5e-6
icvf 0.40
num_spheres 200
</sphere_gamma_packing>
</obstacle>
ini_walkers_pos intra
num_process 1
seed 12345
<END>
