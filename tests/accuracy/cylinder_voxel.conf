# GPU Phase-2e(1) validation: voxel BC + cylinder. One centered z-cylinder (r=3um),
# EXTRA placement (walkers in the pore outside the cylinder), PERIODIC voxel. Walkers
# traverse the pore, wrap at the voxel faces (incl. axial), and reflect off the
# cylinder. Exercises the combined voxel-BC + cylinder path. GPU vs CPU; T2 ~ inf.
N 2000
T 1000
duration 0.100
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/cylinder_voxel
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
boundary_conditions periodic
<obstacle>
cylinders_list tests/accuracy/single_cylinder_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
ini_walkers_pos extra
num_process 1
seed 12345
<END>
