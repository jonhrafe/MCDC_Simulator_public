# =============================================================================
#  MC-DC Simulator -- configuration file
# -----------------------------------------------------------------------------
#  UNITS: by default this file is in STANDARD UNITS (SI): metres, seconds, Tesla.
#  Values are scaled silently to the internal working units (mm, ms) on load.
#  Set  use_mm_ms 1  to declare the file is ALREADY in internal units (mm, ms);
#  then nothing is scaled (this also applies to the scheme file).
#
#  Golden-master experiment #2: TWO impermeable meshes in one simulation
#  (the original sphere + a deformed sphere displaced a few um), loaded via
#  ply_file_list_scale_permeability so a permeability can be set per mesh later.
#  Both meshes impermeable (percolation 0); a finite T2 is set globally.
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-10
t2_intra 0.080
t2_extra 0.080
exp_prefix tests/accuracy/output/two_meshes_impermeable

scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0

# Two meshes via a simple list file (each line: '<ply_file> <scale>').
# Permeability, T2 and d_intra come from the global params -> impermeable here
# (no global permeability). Use ply_extended_file_list to set them per mesh.
<obstacle>
ply_file_list tests/accuracy/two_meshes.list
</obstacle>

<voxels>
-3.1e-6 -3.1e-6 -3.1e-6
 3.1e-6  3.1e-6  3.1e-6
</voxels>

# Initialise walkers INSIDE the meshes (restricted diffusion). With impermeable
# membranes the extra signal must stay ~0 -- a built-in leak detector.
ini_walkers_pos intra

num_process 2
seed 12345
<END>
