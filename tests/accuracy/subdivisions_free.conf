# GPU volumetric-DWI validation: voxel subdivisions. The voxel is split into 2^3=8
# non-overlapping boxes (subdivisions_number 2); each walker is binned by its final
# wrapped position into the box containing it, and the per-box signal forms a volume.
# Free diffusion, periodic BC -> walkers spread across all 8 boxes. GPU must reproduce
# the CPU per-box signal (within MC noise) and the boxes must sum to the global signal.
N 40000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/subdivisions_free
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
subdivisions_number 2
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
