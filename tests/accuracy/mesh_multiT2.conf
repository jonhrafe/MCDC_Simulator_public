# GPU Phase-3b validation: per-obstacle T2 for a MESH. Impermeable unitMesh sphere
# with intra T2 = 40 ms (list col-4) vs extra T2 = 80 ms (t2_extra). Uniform seeding +
# separate_signals: intra/extra decay at different T2. GPU must match the CPU per-step
# T2-weighted signal using the mesh compartment classified at placement.
N 20000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/mesh_multiT2
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
t2_extra 0.080
<obstacle>
ply_extended_file_list tests/accuracy/mesh_multiT2.list
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
