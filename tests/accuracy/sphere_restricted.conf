# =============================================================================
#  MC-DC Simulator -- GPU Phase-2a validation (single impermeable sphere).
#  Restricted diffusion inside one analytic sphere (radius 5 um at origin),
#  walkers init intra, T2 ~ inf. The test runs this on CPU (gpu 0) and GPU
#  (gpu 1) and asserts the signals agree within MC noise. Standard units.
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/sphere_restricted
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

<obstacle>
spheres_list tests/accuracy/single_sphere.list
</obstacle>

<voxels>
-1e-5 -1e-5 -1e-5
 1e-5  1e-5  1e-5
</voxels>

ini_walkers_pos intra
num_process 1
seed 12345
<END>
