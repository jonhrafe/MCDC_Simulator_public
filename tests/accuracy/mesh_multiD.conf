# GPU Phase-3b validation: per-obstacle diffusivity for a MESH. Impermeable unitMesh
# sphere with intra D = 0.2e-9 (slow, list col-3) vs extra D = 1.0e-9 (fast). Uniform
# seeding + separate_signals: intra/extra take different step lengths. GPU must match
# the CPU split. T2 ~ inf so only the diffusivity is exercised.
N 20000
T 1000
duration 0.050
diffusivity 0.6e-9
diff_extra 1.0e-9
exp_prefix tests/accuracy/output/mesh_multiD
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
t2_extra 1e9
<obstacle>
ply_extended_file_list tests/accuracy/mesh_multiD.list
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
