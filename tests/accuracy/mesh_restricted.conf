# GPU Phase-2d validation: restricted diffusion inside the unitMesh sphere (PLY,
# brute-force triangles). Walkers uniform in the voxel (inside the mesh), T2 ~ inf.
# Same geometry as the accuracy_golden. Test runs CPU (gpu 0) vs GPU (gpu 1).
N 2000
T 1000
duration 0.050
diffusivity 0.6e-10
exp_prefix tests/accuracy/output/mesh_restricted
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
<obstacle>
ply tests/accuracy/meshes/unitMesh.ply
ply_scale 0.001
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
