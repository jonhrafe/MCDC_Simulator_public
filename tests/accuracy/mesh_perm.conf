# GPU Phase-6 validation: MESH permeability (Powles crossing). Permeable unitMesh
# sphere, kappa=1e-4 m/s, distinct Di=0.5e-9 / De=2.0e-9 -> directional prob_i_e !=
# prob_e_i. Uniform seeding + separate_signals: walkers cross intra<->extra via the
# transparent-membrane draw and are re-classified at landing. T2 ~ inf so only the
# permeability + per-D step are exercised. The intra/extra equilibrium under crossing
# is precision-fragile (see CMake notes), so the test uses relaxed split tolerances.
N 20000
T 1000
duration 0.050
diffusivity 0.6e-9
d_extra 2.0e-9
exp_prefix tests/accuracy/output/mesh_perm
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
t2_extra 1e9
<obstacle>
ply_extended_file_list tests/accuracy/mesh_perm.list
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
