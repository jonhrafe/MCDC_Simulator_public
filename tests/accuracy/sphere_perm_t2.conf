# GPU Phase-6b validation: PERMEABILITY + finite T2. Permeable sphere (kappa=5e-4);
# intra T2=40ms, extra T2=80ms. Crossers spend time in BOTH compartments, so the T2
# weight must accumulate per step along the actual path (not the final compartment).
# Uniform placement, separate_signals.
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9
permeability 5e-4
t2_intra 0.04
t2_extra 0.08
exp_prefix tests/accuracy/output/sphere_perm_t2
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
deportation 0
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
