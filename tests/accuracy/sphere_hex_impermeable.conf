# =============================================================================
#  MC-DC Simulator -- configuration file. Standard units (m, s, T).
#
#  Golden #3: NATIVE Sphere obstacles (analytic, not a PLY mesh) built by the
#  simulator's hexagonal sphere packing. Validates Sphere::checkCollision /
#  bouncing independently of the mesh path. Impermeable, walkers init intra ->
#  restricted diffusion; extra signal must stay ~0 (leak detector).
#  The hex packing sets the voxel automatically (do not declare <voxels>).
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/sphere_hex_impermeable
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0

<obstacle>
<sphere_hex_packing>
radius 5e-6
icvf 0.5
</sphere_hex_packing>
</obstacle>

ini_walkers_pos intra

num_process 2
seed 12345
<END>
