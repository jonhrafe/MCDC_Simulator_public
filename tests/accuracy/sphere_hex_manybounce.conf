# =============================================================================
#  MC-DC Simulator -- MANY-BOUNCE GPU-vs-CPU regression guard.
#  Restricted diffusion in a hex sphere packing at HIGH T (T=60000 => thousands
#  of membrane reflections per walker). The pre-fix GPU bounce handler leaked a
#  little on every bounce; harmless at T=1000 (every other gpu ctest) but it
#  accumulated to ~30% here. test_gpu_restricted.py asserts CPU and GPU agree
#  within MC noise (TOL 0.02). Standard units.
# =============================================================================
N 2000
T 60000
duration 0.050
diffusivity 2e-9
exp_prefix tests/accuracy/output/sphere_hex_manybounce
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
<obstacle>
<sphere_hex_packing>
radius 1e-6
icvf 0.5
</sphere_hex_packing>
</obstacle>
ini_walkers_pos intra
num_process 4
seed 12345
<END>
