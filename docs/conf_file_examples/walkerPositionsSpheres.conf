# =============================================================================
#  MC-DC Simulator -- configuration file
# -----------------------------------------------------------------------------
#  UNITS: by default this file is in STANDARD UNITS (SI): metres, seconds, Tesla.
#  Values are scaled silently to the internal working units (mm, ms) on load.
#  Set  use_mm_ms 1  to declare the file is ALREADY in internal units (mm, ms);
#  then nothing is scaled (this also applies to the scheme file).
#
#    duration ......................... seconds        [s]
#    diffusivity / d_intra / d_extra .. metre^2/second  [m^2/s]
#    t2_intra / t2_extra .............. seconds        [s]
#    <voxels> / <sampling_area> /
#      <delta> / coll_sphere_dist /
#      hex radius / separation /
#      gamma beta / min_radius /
#      geometry scale factors ......... metres          [m]
#      (ply_scale and the first line of a sphere/cylinder
#       list are now "metres per file unit")
#    permeability (kappa) ............. metre/second    [m/s]   (see exception)
#    scheme file (G, Delta, delta, TE)  Tesla/m, s      [T/m, s]
#
#  EXCEPTION (not standard-unit scaled):
#    * permeability kappa is a VELOCITY: m/s equals mm/ms numerically, so it is
#      scale-invariant (the same value works in either mode).
#
#  Lines beginning with '#' are comments and are ignored.
# =============================================================================

# Start positions from a file, among three impermeable spheres (see instructions/initialization_options.md).
# walker_positions_spheres.txt has 4 rows (metres): the centres of the 3 spheres of three_spheres_T2.list
# (radius 3 um, T2 = 0.05, 0.10, 0.20 s) and one point outside them. Walker g starts at row g mod 4, so
# with N = 1001 the rows get 251, 250, 250 and 250 walkers. The spheres are impermeable, so at b = 0
# (first line of the scheme, TE = 0.045 s):
#   _DWI_intra.txt = 251 exp(-0.045/0.05) + 250 exp(-0.045/0.10) + 250 exp(-0.045/0.20) = 461.09
#   _DWI_extra.txt = 250
# Works the same on the GPU: uncomment 'gpu 1' (GPU build). Run from the repository root.

N 1001
T 1000
duration 0.050
diffusivity 2.0e-9

exp_prefix instructions/demos/output/walker_positions_spheres

scheme_file docs/scheme_files/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
separate_signals

ini_walkers_file docs/conf_file_examples/walker_positions_spheres.txt

<obstacle>
spheres_list docs/conf_file_examples/three_spheres_T2.list
</obstacle>

<voxels>
-10e-6 -10e-6 -10e-6
 10e-6  10e-6  10e-6
</voxels>

# gpu 1
num_process 2
seed 12345

<END>
