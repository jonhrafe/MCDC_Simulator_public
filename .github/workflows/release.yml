name: release

# Publishes the MC/DC binaries as assets on the GitHub Release for the pushed
# version tag (e.g. v2.2.0). The release is created first, then each platform
# uploads its own binary independently -- so a slow/unavailable runner (notably
# the scarce Intel-Mac `macos-13` pool) never blocks publishing the others.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  # 1) Create the Release up front (with auto-generated notes) so the build jobs
  #    only ever ADD assets -- no create-race, nothing to wait on.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # 2) Build each platform and upload its own binary directly to the Release.
  #    fail-fast: false + per-job upload => Intel-Mac lagging or failing does not
  #    affect or delay the other three.
  build:
    name: build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64 }
          - { os: macos-13,       target: macos-x64 }    # Intel (scarce runners -- may lag)
          - { os: macos-latest,   target: macos-arm64 }  # Apple Silicon
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (portable, no -march=native)
        run: cmake -B build -DMCDC_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage + package
        shell: bash
        run: |
          set -e
          ver="${GITHUB_REF_NAME}"                 # the tag, e.g. v2.2.0
          stage="mcdc-${ver}-${{ matrix.target }}"
          mkdir -p "$stage"
          # RUNTIME_OUTPUT_DIRECTORY is the source root; MSVC multi-config nests under Release/.
          for exe in MC-DC_Simulator dataSynth; do
            found=""
            for cand in "$exe" "$exe.exe" "Release/$exe.exe" "Release/$exe" "build/$exe" "build/Release/$exe.exe"; do
              if [ -f "$cand" ]; then cp "$cand" "$stage/"; found=1; break; fi
            done
            if [ -z "$found" ]; then echo "::error::$exe not found"; ls -la; ls -la Release build 2>/dev/null || true; exit 1; fi
          done
          cp LICENSE README.md "$stage/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${stage}.zip" "$stage" >/dev/null      # 7z ships on the Windows runners
          else
            tar -czf "${stage}.tar.gz" "$stage"
          fi

      - name: Upload this binary to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcdc-*.tar.gz
            mcdc-*.zip
          fail_on_unmatched_files: false
