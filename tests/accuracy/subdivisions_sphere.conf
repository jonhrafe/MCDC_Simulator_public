# GPU volumetric-DWI validation with a restricted substrate: a centered sphere plus
# 2^3=8 voxel subdivisions. Walkers (intra + extra) are binned by their final wrapped
# position into the 8 boxes; the per-box signal must match the CPU within MC noise and
# the boxes must sum to the global signal. Exercises subdivision binning alongside the
# obstacle collision / compartment path.
N 40000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/subdivisions_sphere
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
subdivisions_number 2
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
