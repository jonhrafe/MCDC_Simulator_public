# =============================================================================
#  MC-DC Simulator -- sphere packing from an explicit list of radii
# -----------------------------------------------------------------------------
#  Units: SI (m, s, T), see the header of freeDiffusion.conf.
#
#  <sphere_gamma_packing> normally DRAWS the radii from a gamma distribution
#  (alpha, beta, num_spheres). With the optional key
#
#      radii_file <path>
#
#  the packer instead packs EXACTLY the radii listed in the file (one line per
#  sphere:  radius [um]  population_label; # comments allowed). alpha / beta / num_spheres are then
#  ignored (the list defines the radii and the count); icvf still sets the voxel
#  size. Without radii_file the standard gamma sampling is used, unchanged.
#
#  The emitted packing  <exp_prefix>_gamma_distributed_sphere_list.txt  has the
#  columns   x y z r permeability T2 population_label is_replica   (positions and
#  radii in um; the first line is the scale). is_replica = 1 marks periodic copies
#  of a sphere made at the voxel walls, so ground-truth statistics (e.g. a radius
#  histogram per population) must use only the rows with is_replica = 0. For a
#  gamma packing the label is -1.
#
#  NOTE: the packer keeps the best packing it finds; if the list cannot fit at the
#  requested icvf, spheres are dropped ("Percentage of spheres selected" in the
#  log). Lower icvf (bigger voxel) until all of them fit.
# =============================================================================

N 5000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix instructions/demos/output/injected_radii_spheres

scheme_file docs/scheme_files/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0

<obstacle>
<sphere_gamma_packing>
alpha 1.5                            # optional when radii_file is given (the radii come from the file)
beta 0.5e-6
icvf 0.08
num_spheres 12
radii_file docs/conf_file_examples/injected_radii.txt
</sphere_gamma_packing>
</obstacle>

ini_walkers_pos intra

num_process 2
seed 12345
<END>
