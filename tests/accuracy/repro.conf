# =============================================================================
#  MC-DC Simulator -- configuration file
# -----------------------------------------------------------------------------
#  Small, fast, self-contained config for the RNG reproducibility test
#  (tests/test_rng_reproducibility.py). Standard units (m, s, T). The test
#  injects seed / write_txt / write_traj_file and overrides exp_prefix.
# =============================================================================

N 20
T 200
duration 0.050
diffusivity 0.6e-10
exp_prefix tests/accuracy/output/repro

scheme_file tests/accuracy/PGSE_sample_scheme.scheme

<obstacle>
ply tests/accuracy/meshes/unitMesh.ply
ply_scale 1
</obstacle>

<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>

ini_walkers_pos intra

num_process 2
<END>
