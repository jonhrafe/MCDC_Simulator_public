# DEMO: volumetric DWI contrast, restricted (inside spheres) vs free (outside).
# 3 impermeable spheres (r=12 um) at z=0 in a +/-50 um voxel, full-voxel seeding so
# both compartments are sampled. subdivisions_number 100 -> 100^3 = 1e6 sub-voxels of
# 1 um; each sphere (24 um) spans ~24 sub-voxels. Good PGSE b-sweep (b = 0..3000 s/mm^2,
# 10 acquisitions, +x). Free water D=2e-9; over Delta=25ms the diffusion length ~17 um is
# ~ the sphere radius, so inside-sphere walkers are restricted (slow decay -> bright at
# high b) and outside walkers diffuse freely (fast decay -> dark). T2 ~ inf (pure diffusion
# contrast). GPU, binary output. N=100M via the chunked sphere path.
N 100000000
T 1000
duration 0.050
diffusivity 2.0e-9
exp_prefix tests/benchmark/output/three_spheres_demo
scheme_file tests/benchmark/PGSE_bsweep.scheme
write_txt 0
write_bin 1
write_traj_file 0
t2_extra 1e9
subdivisions_number 100
gpu 1
<obstacle>
spheres_list tests/benchmark/three_spheres.list
</obstacle>
<voxels>
-5.0e-5 -5.0e-5 -5.0e-5
 5.0e-5  5.0e-5  5.0e-5
</voxels>
num_process 1
seed 12345
<END>
