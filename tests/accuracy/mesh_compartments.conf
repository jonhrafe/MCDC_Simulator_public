# GPU Phase-3b validation: mesh intra/extra COMPARTMENT classification. Walkers are
# seeded uniformly in the voxel (the unitMesh sphere is smaller than the voxel, so both
# compartments are populated). With separate_signals the GPU must split intra/extra the
# same way the CPU does (point-in-mesh: nearest-triangle signed normal). T2 ~ inf and a
# single diffusivity, so the split only exercises the classification, not T2/D weighting.
N 20000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/mesh_compartments
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
t2_extra 1e9
<obstacle>
ply tests/accuracy/meshes/unitMesh.ply
ply_scale 0.001
</obstacle>
<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>
num_process 1
seed 12345
<END>
