# STRESS (GPU): 10M particles on the merged ~48.9M-triangle strands mesh, volumetric
# DWI via subdivisions_number 10 (10x10x10 = 1000 sub-signals). Walker-chunked so it
# fits in 10 GB VRAM. Geometry um -> ply_scale 0.001; SI units.
N 100000000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/benchmark/output/stress_gpu
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
deportation 0
subdivisions_number 10
gpu 1
<obstacle>
ply_file_list tests/benchmark/strands_merged.list
</obstacle>
<voxels>
-4.95e-4 -4.88e-4 -5.06e-4
 4.95e-4  4.89e-4  5.08e-4
</voxels>
<spawning_area>
-2.0e-4 -2.0e-4 -2.0e-4
 2.0e-4  2.0e-4  2.0e-4
</spawning_area>
num_process 1
seed 12345
<END>
