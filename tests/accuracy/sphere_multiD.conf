# GPU Phase-5 validation: multi-D. Centered sphere; intra diffusivity 0.2e-9 (slow,
# more restricted) vs extra 1.0e-9 (fast). Uniform placement, separate_signals -> intra
# and extra take different step lengths; the GPU must reproduce the CPU split. T2 ~ inf.
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9
diff_intra 0.2e-9
diff_extra 1.0e-9
exp_prefix tests/accuracy/output/sphere_multiD
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
separate_signals 1
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
