# =============================================================================
#  MC-DC Simulator -- capped-PLY cylinder (cross-representation validation).
#  Standard units (m, s, T).
#
#  The SAME single cylinder as cylinder_restricted.conf (radius 5 um, axis along
#  z, IMPERMEABLE) but realised as a triangulated CAPPED mesh instead of a native
#  analytic cylinder. Physics is identical to cylinder_restricted.conf: N, T,
#  duration, diffusivity, scheme, seed, num_process, t2_extra ~ inf.
#
#  cylinder_capped.ply is r=0.005 mm, half_len=0.200 mm (units: mm); ply_scale
#  0.001 (m per file-unit) -> radius 5 um, caps at z = +/- 200 um. The caps make
#  the mesh FINITE, so walkers are seeded in a central <spawning_area> (intra):
#  over the 50 ms diffusion time the 1D RMS step is sqrt(2*D*t) ~ 7.7 um, so a
#  central band of +/- 50 um keeps every walker many sigma away from the caps and
#  from the voxel boundary -> the mesh behaves like an infinite cylinder (pure
#  radial restriction), matching the native-list case for a like-for-like compare.
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/cylinder_ply
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

<obstacle>
ply tests/accuracy/meshes/cylinder_capped.ply
ply_scale 0.001
</obstacle>

# Voxel contains the whole mesh (caps at z = +/- 200 um) with a small margin, so
# there is no periodic wrapping before a walker could reach a cap (it never does).
<voxels>
-8e-6 -8e-6 -2.2e-4
 8e-6  8e-6  2.2e-4
</voxels>

# Central seeding box: full 5 um radial extent, but only the central +/- 50 um in
# z, far from the caps. `intra` keeps only samples inside the cylinder mesh.
<spawning_area>
-5e-6 -5e-6 -5e-5
 5e-6  5e-6  5e-5
</spawning_area>

ini_walkers_pos intra
num_process 1
seed 12345
<END>
