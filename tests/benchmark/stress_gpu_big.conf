# STRESS (GPU, big): 500M particles on the merged ~48.9M-triangle strands mesh.
# FULL voxel seeding (no spawning area), REFLECTIVE (mirror) boundary conditions,
# subdivisions_number 100 -> 100x100x100 = 1,000,000 sub-signals (each of length num_rep).
# Purpose: stress GPU memory + throughput at scale. Walker-chunked so VRAM stays bounded;
# the DWI accumulator alone is ~(1e6+1)*num_rep*2 doubles. Geometry um -> ply_scale 0.001.
N 500000000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/benchmark/output/stress_gpu_big
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
deportation 0
boundary_conditions mirror
subdivisions_number 100
gpu 1
<obstacle>
ply_file_list tests/benchmark/strands_merged.list
</obstacle>
<voxels>
-4.95e-4 -4.88e-4 -5.06e-4
 4.95e-4  4.89e-4  5.08e-4
</voxels>
num_process 1
seed 12345
<END>
