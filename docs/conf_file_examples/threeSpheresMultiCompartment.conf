# =============================================================================
#  Multi-compartment demo: three PLY spheres with DISTINCT intra diffusivity and
#  T2 (impermeable), plus a low-resolution voxel-subdivision volume (20^3).
#  SI units (metres, seconds, Tesla). See instructions/tutorial_multi_compartment.md
# =============================================================================
N 100000
T 500
duration 0.050
diffusivity 2.0e-9
t2_extra 1e9

exp_prefix instructions/demos/output/three_spheres_multi
scheme_file docs/scheme_files/PGSE_multiTE.scheme

write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1
deportation 0

<obstacle>
ply_extended_file_list docs/conf_file_examples/three_spheres_multi.list
</obstacle>

<voxels>
-6.0e-6 -6.0e-6 -6.0e-6
 6.0e-6  6.0e-6  4.8e-5
</voxels>

subdivisions_number 20

num_process 4
seed 12345
<END>
