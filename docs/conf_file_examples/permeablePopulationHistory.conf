# =============================================================================
#  MC-DC Simulator -- permeable sphere with the four-population history split
# -----------------------------------------------------------------------------
#  Units: SI (m, s, T), see the header of freeDiffusion.conf.
#
#  A permeable sphere (r = 5 um, volume fraction 0.5) with DIFFERENT intra/extra
#  diffusivities. Walkers are seeded uniformly, so both compartments are populated
#  and spins exchange across the membrane during the run.
#
#  crossed_filter  splits the signal by each spin's DYNAMICAL HISTORY:
#
#      crossed_filter 0   (default) legacy split: intra / extra by FINAL position, all spins
#      crossed_filter 1   keep only spins that crossed the membrane at least once
#      crossed_filter 2   keep only spins that never crossed
#
#  With 1 or 2 the intra/extra split is made by the SEED (initial) compartment, so two
#  runs (identical except for this value; same seed) give the four channels:
#
#                       <prefix>_DWI_intra.txt          <prefix>_DWI_extra.txt
#      crossed_filter 2   intra-never                     hindered (extra-never)
#      crossed_filter 1   intra -> extra  (efflux)        extra -> intra (influx)
#
#  The channels partition the spins: for every acquisition,
#      <prefix>_DWI.txt (crossed_filter 0)  =  sum of the four channels.
#  Setting crossed_filter implies  separate_signals .  Run this file once with
#  crossed_filter 1, then again with crossed_filter 2 (change the line below and
#  exp_prefix). Keep the same seed and num_process: the runs are then identical
#  trajectories, so the channels add up to output precision.
#
#  Exchange-sensitive runs: keep the extracellular step length below ~1% of the radius
#  (here l_e = sqrt(6 D_e dt) ~ 0.055 um for dt = 0.5 us, l_e/R ~ 1.1%).
# =============================================================================

N 5000
T 100000
duration 0.050

diff_intra 1.0e-10
diff_extra 1.0e-9
permeability 5.0e-5                  # kappa [m/s]; the same value works in any unit mode

exp_prefix instructions/demos/output/permeable_history_crossed

scheme_file docs/scheme_files/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0

crossed_filter 1                     # 1 = crossed (efflux/influx), 2 = never crossed

# One sphere, r = 5 um at the origin. Sphere lists must stay comment-free: the first line is the
# scale [m per file unit] (1e-6 -> micrometres), then  x y z radius [kappa m/s, 0 = global] [T2 s].
<obstacle>
spheres_list docs/conf_file_examples/permeable_sphere.list
</obstacle>

# Cubic voxel with intracellular fraction 0.5:  side = (4/3 pi r^3 / 0.5)^(1/3) = 10.15 um
<voxels>
-5.0775e-6 -5.0775e-6 -5.0775e-6
 5.0775e-6  5.0775e-6  5.0775e-6
</voxels>

num_process 4
seed 12345
<END>
