# CPU-vs-GPU validation: 3 PLY spheres (r=5um at z=0/21/42um) with DISTINCT per-sphere
# Di, T2 and permeability (via ply_extended_file_list). New protocol (PGSE b-sweep
# 0..3000), periodic BC (the validated one), full-voxel seeding, separate_signals so we
# get the intra/extra split + equilibrium. No subdivisions here (the CPU subdivision
# binning is O(n_sub) -> 1e6 boxes is GPU-only); the volumetric run is a separate config.
N 2000000
T 1000
duration 0.050
diffusivity 2.0e-9
exp_prefix tests/benchmark/output/three_imp_mte_cpu
scheme_file tests/benchmark/PGSE_3sph_multiTE.scheme
write_txt 0
write_bin 1
write_traj_file 0
t2_extra 1e9
separate_signals 1
deportation 0
<obstacle>
ply_extended_file_list tests/benchmark/three_imp_T2.list
</obstacle>
<voxels>
-1.2e-5 -1.2e-5 -1.0e-5
 1.2e-5  1.2e-5  5.2e-5
</voxels>
subdivisions_number 100
gpu 0
num_process 1
seed 12345
<END>
