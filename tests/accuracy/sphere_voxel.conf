# GPU Phase-2e(a) validation: voxel BC + obstacle together. One centered sphere
# (r=4 um), EXTRA placement (walkers start in the pore space outside the sphere),
# PERIODIC voxel -> walkers traverse the pore, wrap at the voxel faces, and reflect
# off the sphere. Exercises the combined voxel-BC + obstacle path. GPU vs CPU; T2 ~ inf.
N 2000
T 1000
duration 0.100
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/sphere_voxel
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
boundary_conditions periodic
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
ini_walkers_pos extra
num_process 1
seed 12345
<END>
