# GPU Phase-4 validation: multi-T2. Centered sphere with intra T2 = 40 ms; extra
# T2 = 80 ms (t2_extra 0.08 s). Uniform placement, separate_signals -> intra and extra
# decay at different T2; the GPU must reproduce the CPU's T2-weighted signal.
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/sphere_multiT2
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 0.08
separate_signals 1
<obstacle>
spheres_list tests/accuracy/single_sphere_t2.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
