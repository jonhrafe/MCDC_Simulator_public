# GPU Phase-2e validation: STRADDLING periodic images, cylinders. Hex cylinder
# packing (images auto-replicated into the list), EXTRA placement (walkers in the
# pore), PERIODIC voxel -> walkers wrap and collide with cylinders + their periodic
# images. T2 ~ inf. GPU vs CPU.
N 2000
T 1000
duration 0.100
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/cylinder_hex_extra
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
<obstacle>
<cylinder_hex_packing>
radius 5e-6
icvf 0.5
</cylinder_hex_packing>
</obstacle>
ini_walkers_pos extra
num_process 1
seed 12345
boundary_conditions periodic
<END>
