# =============================================================================
#  MC-DC Simulator -- GPU free-diffusion validation. Standard units (m, s, T).
#
#  Free diffusion (NO obstacles): the PGSE signal must follow S/S0 = exp(-b*D).
#  Run on the GPU (`gpu 1`). The voxel is large enough that periodic wrapping is
#  negligible over the diffusion length, so this is effectively unbounded free
#  diffusion (matches the on-device kernel, which has no boundaries). T2 = inf.
# =============================================================================

N 100000
T 1000
duration 0.100
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/free_diffusion
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0

<voxels>
-5e-3 -5e-3 -5e-3
 5e-3  5e-3  5e-3
</voxels>

num_process 1
seed 12345
gpu 1
<END>
