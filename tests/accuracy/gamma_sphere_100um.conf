# =============================================================================
#  MC-DC Simulator -- tissue-scale GAMMA sphere packing (~100 um voxel).
#
#  Calibrated realistic substrate for the generator-fidelity test
#  (tests/validation/test_gamma_packing.py) and for CPU/GPU parity at scale.
#
#  Gamma(alpha, beta) radii, SI units (beta in metres): mean radius = alpha*beta.
#    alpha 1.5, beta 2.0e-6  -> mean radius 3.0 um
#  The voxel side is AUTO-derived from the ICVF and the drawn radii
#  (L = (Sum 4/3 pi r^3 / icvf)^(1/3)); num_spheres 900 at icvf 0.40 lands the
#  voxel at ~102 um/side (measured: mean r 3.00 um, ICVF 40.0% = 99% of target).
#  min_radius is left at its default 0 -> no low-tail truncation, so the realised
#  mean equals alpha*beta exactly. (num_spheres ~720 lands the voxel nearer 100 um.)
#
#  The run also writes the realised packing to
#    <exp_prefix>_gamma_distributed_sphere_list.txt
#  which is a native `spheres_list` substrate (reusable as a frozen fixture).
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/gamma_sphere_100um
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

<obstacle>
<sphere_gamma_packing>
alpha 1.5
beta 2.0e-6
icvf 0.40
num_spheres 900
</sphere_gamma_packing>
</obstacle>

ini_walkers_pos intra
num_process 1
seed 12345
<END>
