# =============================================================================
#  MC-DC Simulator -- GPU Phase-2c validation (multiple spheres, hex packing).
#  Restricted diffusion among an impermeable hexagonal sphere packing; walkers
#  init intra, T2 ~ inf. The test runs CPU (gpu 0) vs GPU (gpu 1) and asserts the
#  signals agree within MC noise + float32 tolerance. Standard units.
# =============================================================================

N 2000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/sphere_hex_gpu
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

<obstacle>
<sphere_hex_packing>
radius 5e-6
icvf 0.5
</sphere_hex_packing>
</obstacle>

ini_walkers_pos intra
num_process 1
seed 12345
<END>
