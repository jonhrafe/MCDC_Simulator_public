# =============================================================================
#  STRESS TEST -- single MERGED tissue mesh (~48.9M triangles), loadable by BOTH
#  CPU and GPU. All 10924 strand PLYs were concatenated into one binary PLY, so the
#  CPU builds ONE grid (not one per PLY) and a fair CPU-vs-GPU comparison is possible.
#  Toggle 'gpu 0' / 'gpu 1'. Geometry in um -> ply_scale 0.001. SI units.
# =============================================================================
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/benchmark/output/strands_merged
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

deportation 0               # crossing sentinel OFF -- mesh is not watertight

<obstacle>
ply_file_list tests/benchmark/strands_merged.list
</obstacle>

<voxels>
-4.95e-4 -4.88e-4 -5.06e-4
 4.95e-4  4.89e-4  5.08e-4
</voxels>

<spawning_area>
-2.0e-4 -2.0e-4 -2.0e-4
 2.0e-4  2.0e-4  2.0e-4
</spawning_area>

# uniform placement in the spawning area (the GPU mesh kernel doesn't do intra/extra
# point-in-mesh classification yet, so use uniform for an apples-to-apples CPU-vs-GPU).
num_process 1
seed 12345
<END>
