# =============================================================================
#  MC-DC Simulator -- PERFORMANCE BENCHMARK (not a correctness test).
#  Standard units (m, s, T).
#
#  Demanding substrate: PorusMedia.ply (39,674 verts / 82,688 triangles) to stress
#  collision detection + the AABB grid. Voxel = mesh bounding box (ply_scale 0.001
#  => internal mm) + ~0.1 um epsilon, taken from the mesh limits. 10 cores.
#  Walkers init intra (restricted diffusion -> heavy membrane interaction).
#  Trajectory output OFF (would be huge and dominate I/O); DWI signal ON so the
#  result can be hash-compared before/after optimizations.
#
#  Use tests/benchmark/run_bench.sh to capture wall time, peak RSS, and the DWI hash.
# =============================================================================

N 20000
T 1500
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/benchmark/output/porous_media
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0

<obstacle>
ply instructions/meshes/PorusMedia.ply
ply_scale 0.001
</obstacle>

# Voxel from the PorusMedia bounding box (file bbox * 1e-6 m) + ~0.1 um margin.
<voxels>
-7.55e-6 -6.07e-6 -2.289e-5
 6.07e-6  6.13e-6  3.018e-5
</voxels>

ini_walkers_pos intra

num_process 10
seed 12345
<END>
