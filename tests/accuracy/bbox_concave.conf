# =============================================================================
#  MC-DC Simulator -- <bounding_box> auto-voxel, NON-CONVEX shell (dumbbell).
#
#  Same setup as bbox_convex.conf but the obstacle is a NON-CONVEX dumbbell (an
#  icosphere pinched at the equator, so its silhouette radius is non-monotonic in
#  z -- a reentrant waist). The <bounding_box> flag still auto-computes the voxel +
#  sampling area from the mesh AABB, walkers are seeded UNIFORMLY (intra+extra
#  mix), and the shell is IMPERMEABLE.
#
#  POINT OF THIS CASE: the CPU inside/outside test is nearest-triangle-normal,
#  which is only reliable for CONVEX shells; on a concave shell it can misclassify
#  walkers near the reentrant waist, so the CPU b0 intra fraction may deviate from
#  the true geometric volume fraction. The GPU uses a parity ray-cast
#  (concave-safe) and is the trusted classifier -- the test compares CPU vs GPU
#  and self-skips without CUDA. This case must RUN on CPU without crashing.
#  Standard (SI) units; ply_scale 1 (metres/file-unit, x1000 -> internal mm).
# =============================================================================

N 4000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/bbox_concave
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0
verbatim 1

<obstacle>
ply tests/accuracy/meshes/concave_dumbbell.ply
ply_scale 1
</obstacle>

<bounding_box>

num_process 1
seed 12345
<END>
