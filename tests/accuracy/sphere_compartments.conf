# GPU Phase-3 validation: per-walker COMPARTMENT tracking. One centered sphere
# (r=4 um), UNIFORM placement (a mix of intra + extra), separate_signals -> the GPU
# must split intra/extra the same way the CPU does. T2 ~ inf, impermeable.
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/accuracy/output/sphere_compartments
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
separate_signals 1
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
