# =============================================================================
#  MC-DC Simulator -- two-compartment PERMEABLE exchange fixture (Kärger).
#  One analytic sphere (radius 5 um, from single_sphere.list, whose list
#  permeability is 0) made PERMEABLE via the global `obstacle_permeability`
#  (kappa in m/s). Distinct intra/extra diffusivities and slow exchange, with
#  walkers seeded UNIFORMLY in the voxel so the compartment fractions are known
#  purely from geometry:
#
#      f_intra = V_sphere / V_voxel = (4/3)pi R^3 / (2a)^3
#              = (4/3)pi (5e-6)^3 / (13e-6)^3  ~= 0.238   (f_extra ~= 0.762)
#
#  T2 -> inf in both compartments so relaxation never confounds the diffusion
#  signal. separate_signals gives the intra/extra split; num_process 1 + fixed
#  seed make it reproducible.
#
#  NOTE (see test_karger_exchange.py): intra diffusion in a 5 um sphere is
#  RESTRICTED (non-Gaussian), so this is a well-defined permeable two-compartment
#  system but NOT a clean Kärger substrate (Kärger assumes Gaussian compartments
#  with fixed apparent D). The test validates the oracle + this fixture's
#  geometry/limits and SKIPS the raw Kärger fit -- see that file for the regime a
#  quantitative Kärger validation would need.
# =============================================================================

N 8000
T 1000
duration 0.050
diffusivity 0.6e-9
d_intra 0.6e-9
d_extra 2.0e-9

# kappa (membrane permeability, m/s). Small -> slow exchange (tau_ex >> nothing
# here, but well below the fast-exchange limit); applied because the list kappa is 0.
obstacle_permeability 1e-5

# no relaxation: keep the signal purely diffusion/exchange weighted
t2_intra 1e9
t2_extra 1e9

exp_prefix tests/accuracy/output/karger_exchange
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0
separate_signals 1

<obstacle>
spheres_list tests/accuracy/single_sphere.list
</obstacle>

<voxels>
-6.5e-6 -6.5e-6 -6.5e-6
 6.5e-6  6.5e-6  6.5e-6
</voxels>

num_process 1
seed 12345
<END>
