# =============================================================================
#  MC-DC Simulator -- EXTREME MEMORY-LOAD TEST (NOT accuracy / NOT throughput).
#  Standard units (m, s, T).
#
#  Purpose: confirm the simulator can LOAD and hold an extreme mesh, and measure
#  peak memory + load time. Substrate: hp_outer_erode_0_xyz.ply (cleaned to x,y,z)
#  -- 96,682,686 vertices / 193,229,554 triangles (~3.5 GB). ply_scale 0.001
#  (file units -> internal mm); voxel = mesh bounding box (file bbox * 1e-6 m).
#
#  ON HOLD for accuracy/throughput, because:
#   - uniform placement on this sparse voxel sends most walkers through an O(N)
#     nearest-triangle fallback (the "FAILED" prints in dynamicsSimulation.cpp:703),
#     so the compute time / signal here are NOT meaningful;
#   - the mesh's normals are unverified (to be checked offline).
#  Use only as a memory-load probe. Run via tests/benchmark/run_stress.sh.
# =============================================================================

N 100
T 100
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/benchmark/output/stress_hp
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0

<obstacle>
ply /home/jonathan/Desktop/hp_outer_erode_0_xyz.ply
ply_scale 0.001
</obstacle>

# Voxel from the mesh bounding box (file bbox * 1e-6 m) + ~1 um margin.
<voxels>
-4.6842e-4 -4.6004e-4 -4.6557e-4
 4.6842e-4  4.6121e-4  4.6551e-4
</voxels>

num_process 10
seed 12345
<END>
