# =============================================================================
#  MC-DC Simulator -- STRESS TEST (not a correctness/gold-standard test).
#  Standard units (m, s, T).
#
#  Gigantic substrate: hp_outer_erode_0_xyz.ply (cleaned to x,y,z only) --
#  96,682,686 vertices / 193,229,554 triangles (~3.5 GB). Purpose: measure load
#  time, peak memory and per-step throughput on an extreme mesh. ply_scale 0.001
#  (file units -> internal mm); voxel = mesh bounding box (file bbox * 1e-6 m).
#  Walkers placed uniformly (no intra rejection sampling on a 193M-tri mesh).
#  Small N/T probe first -- scale up via tests/benchmark/run_stress.sh.
# =============================================================================

N 100
T 100
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/benchmark/output/stress_hp
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

write_txt 1
write_bin 0
write_traj_file 0

<obstacle>
ply /home/jonathan/Desktop/hp_outer_erode_0_xyz.ply
ply_scale 0.001
</obstacle>

# Voxel from the mesh bounding box (file bbox * 1e-6 m) + ~1 um margin.
<voxels>
-4.6842e-4 -4.6004e-4 -4.6557e-4
 4.6842e-4  4.6121e-4  4.6551e-4
</voxels>

num_process 10
seed 12345
<END>
