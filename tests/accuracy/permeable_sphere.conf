# Powles permeability validation: single permeable sphere, DISTINCT Di and De so
# the prescribed prob_i_e != prob_e_i (directional). Uniform seeding in a tight
# voxel populates both sides; num_process 1 for exact (race-free) counters.
N 2000
T 1000
duration 0.050

diffusivity 0.6e-9
d_extra 2.0e-9
t2_extra 0.080

exp_prefix tests/accuracy/output/permeable_sphere
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

<obstacle>
ply_extended_file_list tests/accuracy/permeable_sphere.list
</obstacle>

<voxels>
-1.1e-6 -1.1e-6 -1.1e-6
 1.1e-6  1.1e-6  1.1e-6
</voxels>

num_process 1
seed 12345
<END>
