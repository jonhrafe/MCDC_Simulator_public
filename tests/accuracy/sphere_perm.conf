# GPU Phase-6 validation: PERMEABILITY. Centered sphere, global membrane permeability
# kappa=5e-4 m/s (the working analytic-obstacle path; the per-sphere-list percolation
# column is dead code on the CPU). Walkers cross intra<->extra via the Powles draw.
# Uniform placement, separate_signals, T2 ~ inf (T2-with-permeability is Phase 6b).
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9
permeability 5e-4
exp_prefix tests/accuracy/output/sphere_perm
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
separate_signals 1
deportation 0
<obstacle>
spheres_list tests/accuracy/single_sphere_centered.list
</obstacle>
<voxels>
-5e-6 -5e-6 -5e-6
 5e-6  5e-6  5e-6
</voxels>
num_process 1
seed 12345
<END>
