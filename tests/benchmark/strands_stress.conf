# =============================================================================
#  GPU STRESS TEST -- full tissue model: 10924 PLY strands (~49M triangles).
#  Validates (1) PLY-list loading, (2) crossing sentinel OFF (meshes not perfect),
#  (3) GPU mesh simulation (merged mesh + AABB grid) with a signal sanity check.
#  Geometry is in micrometres; ply_scale 0.001 maps file um -> internal mm. The
#  voxel spans the global bbox; walkers spawn in a central dense cube. SI units.
# =============================================================================
N 10000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/benchmark/output/strands_stress
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9

deportation 0               # crossing sentinel ("border patrol") OFF -- the mesh is
                            # not watertight. (The GPU path never deports anyway.)

<obstacle>
ply_file_list tests/benchmark/strands.list
</obstacle>

<voxels>
-4.95e-4 -4.88e-4 -5.06e-4
 4.95e-4  4.89e-4  5.08e-4
</voxels>

<spawning_area>
-2.0e-4 -2.0e-4 -2.0e-4
 2.0e-4  2.0e-4  2.0e-4
</spawning_area>

ini_walkers_pos extra
num_process 1
seed 12345
gpu 1
<END>
