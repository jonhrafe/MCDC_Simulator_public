# =============================================================================
#  MC-DC Simulator -- <bounding_box> auto-voxel, CONVEX shell (icosphere).
#
#  The <bounding_box> flag auto-computes the voxel (and the walker sampling area)
#  from the obstacle extents -- here the AABB of the PLY mesh -- so NO <voxels>
#  block is given. Walkers are seeded UNIFORMLY over that AABB (default sampling),
#  giving an intra+extra mix; the shell is IMPERMEABLE so each walker stays in its
#  spawn compartment. With separate_signals the b0 intra fraction therefore equals
#  the geometric volume fraction (mesh volume / AABB volume) of the convex shell.
#  For a CONVEX mesh the CPU nearest-triangle-normal inside/outside test is
#  reliable, so this runs and is asserted on CPU. Standard (SI) units; ply_scale 1
#  is metres/file-unit (silently x1000 to internal mm) -> ~20 um icosphere.
#  verbatim 1 makes the simulator print the computed "Min/Max limits".
# =============================================================================

N 4000
T 1000
duration 0.050
diffusivity 0.6e-9

exp_prefix tests/accuracy/output/bbox_convex
scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0
verbatim 1

<obstacle>
ply tests/accuracy/meshes/convex_icosphere.ply
ply_scale 1
</obstacle>

<bounding_box>

num_process 1
seed 12345
<END>
