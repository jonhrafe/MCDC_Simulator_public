# QUICK memory test: 10M particles, 100^3 = 1,000,000 subdivisions, mirror BC, full
# voxel seeding, merged ~48.9M-tri strands mesh. Checks VRAM handling with a huge
# sub-voxel count (the DWI accumulator alone is ~(1e6+1)*num_rep*2 doubles ~ 4.3 GB)
# before the full 500M stress run.
N 10000000
T 1000
duration 0.050
diffusivity 0.6e-9
exp_prefix tests/benchmark/output/stress_gpu_10M_1Msub
scheme_file tests/accuracy/PGSE_sample_scheme.scheme
write_txt 1
write_bin 0
write_traj_file 0
t2_extra 1e9
deportation 0
boundary_conditions mirror
subdivisions_number 100
gpu 1
<obstacle>
ply_file_list tests/benchmark/strands_merged.list
</obstacle>
<voxels>
-4.95e-4 -4.88e-4 -5.06e-4
 4.95e-4  4.89e-4  5.08e-4
</voxels>
num_process 1
seed 12345
<END>
