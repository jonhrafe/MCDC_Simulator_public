# =============================================================================
#  MC-DC Simulator -- configuration file
# -----------------------------------------------------------------------------
#  UNITS: by default this file is in STANDARD UNITS (SI): metres, seconds, Tesla.
#  Values are scaled silently to the internal working units (mm, ms) on load.
#  Set  use_mm_ms 1  to declare the file is ALREADY in internal units (mm, ms);
#  then nothing is scaled (this also applies to the scheme file).
#
#  Golden-master experiment #2 (STRESS): TWO impermeable meshes in one
#  simulation (the original sphere + a deformed sphere displaced a few um),
#  loaded via ply_extended_file_list with DISTINCT d_intra and T2 per mesh, and
#  DISTINCT extra-cellular d_extra / t2_extra. Walkers are seeded uniformly so
#  all three compartments (sphere1, sphere2, extra) are populated -- this checks
#  that each particle picks up the Di/T2 of the compartment it starts in.
#  Both meshes impermeable (permeability 0). Run with `debug 1` to dump the
#  per-step per-walker trace (position, compartment, Di, T2) for validation.
# =============================================================================

N 2000
T 1000
duration 0.050

diffusivity 0.6e-10
d_extra 2.0e-9
t2_extra 0.080

exp_prefix tests/accuracy/output/two_meshes_impermeable

scheme_file tests/accuracy/PGSE_sample_scheme.scheme

separate_signals 1
write_txt 1
write_bin 0
write_traj_file 0

# Two meshes with per-mesh properties (each line: <ply> <scale> <d_intra> <t2> <permeability>).
<obstacle>
ply_extended_file_list tests/accuracy/two_meshes.list
</obstacle>

<voxels>
-3.1e-6 -3.1e-6 -3.1e-6
 3.1e-6  3.1e-6  3.1e-6
</voxels>

num_process 2
seed 12345
<END>
