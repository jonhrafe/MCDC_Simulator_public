# Per-TE snapshot demo: free diffusion from a small central seed; the b0 density spreads with TE.
N 10000000
T 1000
duration 0.050
diffusivity 2.0e-9
exp_prefix tests/benchmark/output/diffusion_movie
scheme_file tests/benchmark/PGSE_3sph_multiTE.scheme
write_txt 0
write_bin 1
write_traj_file 0
t2_extra 1e9
gpu 1
<voxels>
-5.0e-5 -5.0e-5 -5.0e-5
 5.0e-5  5.0e-5  5.0e-5
</voxels>
<sampling_area>
-2.0e-6 -2.0e-6 -2.0e-6
 2.0e-6  2.0e-6  2.0e-6
</sampling_area>
subdivisions_number 100
subdivisions_at_te 1
num_process 1
<END>
